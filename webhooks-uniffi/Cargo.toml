[package]
name = "chipa-webhooks-ffi"
version = "0.1.0"
edition = "2024"

[package.metadata.docs.rs]
features = ["async", "python", "kotlin", "swift", "java", "cpp", "c"]

[lib]
crate-type = ["cdylib", "staticlib"]
name = "chipa_webhooks"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
chipa-webhooks = { path = ".." }
rootcause = "0.12.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
uniffi = { version = "0.29.4", features = ["cargo-metadata"] }

[build-dependencies]
cbindgen = "0.27"

[features]
default = []
async = ["uniffi/tokio"]
bindgen = ["uniffi/cli"]
c = []
cpp = []
java = []
kotlin = []
python = []
swift = []
